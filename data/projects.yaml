- title: "Quantum Rings Model Predictor"
  subtitle: "Advanced Software Engineering"
  description: >
    Benchmarked GPU/CPU performance across quantum computing backends using the QuantumRings SDK
    on the Wendian HPC cluster, with a parallelized Slurm array-job pipeline for large-scale runs.
    Built a regex-based QASM 2.0 parser extracting 71 circuit features to train XGBoost models that
    predict circuit runtime and peak memory usage, using SHAP-based feature importance analysis to
    pick the best model.
  tags: ["Python", "XGBoost", "SHAP", "HPC", "Slurm"]
  github: ""
  demo: ""

